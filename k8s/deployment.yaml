apiVersion: apps/v1
kind: Deployment
metadata:
  name: wisecow
spec:
  replices: 2
  selector:
   matchLabels:
     app: wisecow
  template:
   metadata:
    labels:
      app: wisecow
spec:
  containers:
  - name: wisecow
    image: honeys27/wisecow-accuknox:latest
    ports:
    - containerPort: 4499
